name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # En PRs: DiffMap del propio PR como artefacto descargable (compass-review.html)
  review-map:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: node packages/cli/dist/index.js diff --base origin/${{ github.base_ref }} -H HEAD
      - run: node packages/cli/dist/index.js export -o compass-review.html
      - uses: actions/upload-artifact@v4
        with:
          name: compass-review
          path: compass-review.html
